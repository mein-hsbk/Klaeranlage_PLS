<!DOCTYPE html>

<style>

  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:10px;
       background:linear-gradient(#16213eee,#16213e99 70%,#16213e00);pointer-events:none}
  #top h1{margin:0;font-size:15px;letter-spacing:.3px}
  #top .sub{font-size:11px;color:#b2bec3;font-family:monospace}

  .btn.on{background:#00b894;border-color:#00b894;color:#0b1a2e;font-weight:bold}
  #bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:#16213ef0;border-top:1px solid #0f3460}

  #opts{display:flex;gap:6px;margin-top:7px;overflow-x:auto}

  #info{position:fixed;left:8px;right:8px;max-width:460px;margin:0 auto;background:#16213ef5;border:1px solid #2d4a7a;border-radius:10px;
        padding:10px 12px 12px;display:none;max-height:42vh;overflow:auto;box-shadow:0 6px 24px #0007}
  #info h2{margin:0 26px 2px 0;font-size:15px;color:#ffeaa7}
  #info .kks{font-family:monospace;font-size:11px;color:#74b9ff;margin-bottom:6px}
  #info p{font-size:12.5px;line-height:1.4;margin:6px 0 8px;color:#dfe6e9}
  #info table{border-collapse:collapse;font-size:12px}
  #info td{padding:3px 10px 3px 0;vertical-align:top;border-bottom:1px solid #0f3460}

  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#16213ed9;border:1px solid #2d4a7a;color:#fff;

  #legend{position:fixed;right:8px;display:none;background:#16213ee6;border:1px solid #2d4a7a;border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.55}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------------------------------------------------------------------ Renderer / Szene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd4e6);
scene.fog = new THREE.Fog(0xbcd4e6, 380, 950);

const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 2500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.46;
controls.minDistance = 12;
controls.maxDistance = 650;
controls.screenSpacePanning = false;

scene.add(new THREE.HemisphereLight(0xdcecff, 0x5d6b48, 0.85));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.1);
sun.position.set(-140, 220, 110);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -240, right: 240, top: 200, bottom: -200, near: 10, far: 700 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
scene.add(sun);

// ------------------------------------------------------------------ Materialien
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: o.r ?? 0.85, metalness: o.m ?? 0, ...o.x });
const M = {
  concrete: std(0xbab6ad), concreteDark: std(0x8f8b84), asphalt: std(0x45474a, { r: 0.95 }),
  paving: std(0x9a9890, { r: 0.95 }), steel: std(0x8d949b, { r: 0.4, m: 0.6 }), steelDark: std(0x4f565c, { r: 0.5, m: 0.5 }),
  galv: std(0xb7bcc1, { r: 0.45, m: 0.55 }), grating: std(0x7a8086, { r: 0.6, m: 0.4 }),
  brick: std(0x98563f), plaster: std(0xe8e3d8), sheet: std(0xc6cacf, { r: 0.55, m: 0.25 }), sheetBlue: std(0x5b7c99, { r: 0.55, m: 0.2 }),
  roof: std(0x5b5f63, { r: 0.8 }), window: std(0x2a3c4e, { r: 0.15, m: 0.4 }), door: std(0x6b7178, { r: 0.6, m: 0.3 }),
  gas: std(0xe9c12b, { r: 0.45, m: 0.2 }), pe: std(0xeef0ee, { r: 0.6 }), membrane: std(0xc3c9be, { r: 0.7 }),
  green: std(0x5e7d68, { r: 0.6, m: 0.2 }), container: std(0x2f6fa8, { r: 0.6, m: 0.3 }), containerG: std(0x4f7a3a, { r: 0.6, m: 0.3 }),
  rubber: std(0x222222), trunk: std(0x5a4430), fence: new THREE.MeshStandardMaterial({ color: 0x7f8c84, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide })
};
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 10);

// Wasser-Normalmap (prozedural, kachelbar)
const waterNormal = (() => {
  const S = 128, d = new Uint8Array(S * S * 4);
  const W = [[3, 1, .9, 0], [-2, 3, .7, 1.3], [5, -2, .4, 2.1], [1, -6, .3, .7], [7, 4, .2, 2.9]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let dx = 0, dy = 0;
    for (const [kx, ky, a, p] of W) { const c = Math.cos(2 * Math.PI * (kx * x + ky * y) / S + p) * a * 2 * Math.PI / S; dx += c * kx; dy += c * ky; }
    const n = new THREE.Vector3(-dx * 6, -dy * 6, 1).normalize(), i = (y * S + x) * 4;
    d[i] = (n.x * .5 + .5) * 255; d[i + 1] = (n.y * .5 + .5) * 255; d[i + 2] = (n.z * .5 + .5) * 255; d[i + 3] = 255;
  }
  const t = new THREE.DataTexture(d, S, S); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.needsUpdate = true; return t;
})();
const waters = [];
function waterMat(color, rep = 4, flow = [0.004, 0.003]) {
  const tex = waterNormal.clone(); tex.repeat.set(rep, rep); tex.needsUpdate = true;
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.14, metalness: 0.1, normalMap: tex, normalScale: new THREE.Vector2(0.14, 0.14) });
  waters.push({ tex, flow }); return m;
}

// ------------------------------------------------------------------ Hilfsfunktionen
function box(parent, w, h, d, mat, x, y, z, ry = 0, shadow = true) {
  const m = new THREE.Mesh(boxGeo, mat); m.scale.set(w, h, d); m.position.set(x, y + h / 2, z); m.rotation.y = ry;
  m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function cyl(parent, rt, rb, h, mat, x, y, z, seg = 32, open = false) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat); m.position.set(x, y + h / 2, z);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
// Instanz-Sammler (Geländer, Fenster, Pfosten …)
const inst = {};
function ib(key, geo, mat, x, y, z, sx, sy, sz, ry = 0, cast = true) {
  (inst[key] ||= { geo, mat, cast, list: [] }).list.push([x, y, z, sx, sy, sz, ry]);
}
function flushInst() {
  const o = new THREE.Object3D();
  for (const k in inst) {
    const r = inst[k], im = new THREE.InstancedMesh(r.geo, r.mat, r.list.length);
    r.list.forEach((p, i) => { o.position.set(p[0], p[1], p[2]); o.scale.set(p[3], p[4], p[5]); o.rotation.set(0, p[6], 0); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
    im.castShadow = r.cast; im.receiveShadow = true; scene.add(im);
  }
}
function railing(pts, y, h = 1.1) {
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, z0] = pts[i], [x1, z1] = pts[i + 1], dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz), ry = -Math.atan2(dz, dx);
    const mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
    ib('rail', boxGeo, M.galv, mx, y + h, mz, L, 0.05, 0.05, ry, false);
    ib('rail', boxGeo, M.galv, mx, y + h * 0.5, mz, L, 0.04, 0.04, ry, false);
    const n = Math.max(1, Math.ceil(L / 1.8));
    for (let k = 0; k <= n; k++) ib('post', boxGeo, M.galv, x0 + dx * k / n, y + h / 2, z0 + dz * k / n, 0.05, h, 0.05, ry, false);
  }
}
const circlePts = (cx, cz, r, n = 48) => Array.from({ length: n + 1 }, (_, i) => [cx + r * Math.cos(i / n * Math.PI * 2), cz + r * Math.sin(i / n * Math.PI * 2)]);

function building(parent, cx, cz, w, d, h, o = {}) {
  box(parent, w, h, d, o.wall || M.plaster, cx, 0, cz);
  if (o.gable) {
    const rh = o.gable, s = new THREE.Shape();
    s.moveTo(-d / 2 - 0.4, 0); s.lineTo(d / 2 + 0.4, 0); s.lineTo(0, rh); s.closePath();
    const g = new THREE.ExtrudeGeometry(s, { depth: w + 0.6, bevelEnabled: false });
    g.rotateY(Math.PI / 2); g.translate(-(w + 0.6) / 2, 0, 0);
    const m = new THREE.Mesh(g, o.roof || M.roof); m.position.set(cx, h, cz); m.castShadow = m.receiveShadow = true; parent.add(m);
  } else {
    box(parent, w + 0.3, 0.45, d + 0.3, o.roof || M.roof, cx, h, cz);
  }
  const floors = o.floors || 1, fh = h / floors;
  if (o.win !== false) for (let f = 0; f < floors; f++) {
    const wy = f * fh + fh * 0.42, wh = o.band ? fh * 0.38 : 1.2;
    for (const side of [1, -1]) {
      if (o.band) ib('win', boxGeo, M.window, cx, wy, cz + side * (d / 2 + 0.03), w - 3, wh, 0.08, 0, false);
      else for (let x = cx - w / 2 + 2; x <= cx + w / 2 - 2; x += o.winStep || 3.2)
        ib('win', boxGeo, M.window, x, wy, cz + side * (d / 2 + 0.03), 1.5, wh, 0.08, 0, false);
    }
  }
  for (const dr of (o.doors || [])) { // {s:'s'|'n'|'e'|'w', off, w, h}
    const W = dr.w || 1.2, H = dr.h || 2.2;
    if (dr.s === 's' || dr.s === 'n') ib('door', boxGeo, M.door, cx + (dr.off || 0), H / 2, cz + (dr.s === 's' ? 1 : -1) * (d / 2 + 0.05), W, H, 0.1, 0, false);
    else ib('door', boxGeo, M.door, cx + (dr.s === 'e' ? 1 : -1) * (w / 2 + 0.05), H / 2, cz + (dr.off || 0), 0.1, H, W, 0, false);
  }
}

// ------------------------------------------------------------------ Komponenten-Registry
const comps = {}; const pickables = [];
function reg(id, group, info) {
  scene.add(group); group.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(group), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  group.traverse(o => { if (o.isMesh) { o.userData.comp = id; pickables.push(o); } });
  comps[id] = { id, group, ...info, center: new THREE.Vector3(c.x, 0, c.z), anchor: info.anchor || new THREE.Vector3(c.x, b.max.y + 1.5, c.z), radius: Math.max(s.x, s.z) / 2 };
}
const anims = [];

// Rundbecken (VK, NK, Voreindicker)
function roundTank(cx, cz, r, o) {
  const g = new THREE.Group(); g.position.set(cx, 0, cz);
  const top = o.wallH ?? 1.0, wl = top - 0.25, V2 = THREE.Vector2;
  const wall = new THREE.Mesh(new THREE.LatheGeometry([new V2(r, -1), new V2(r + 0.4, -1), new V2(r + 0.4, top), new V2(r, top), new V2(r, -1)], 80), M.concrete);
  wall.castShadow = wall.receiveShadow = true; g.add(wall);
  const water = new THREE.Mesh(new THREE.CircleGeometry(r, 80).rotateX(-Math.PI / 2), waterMat(o.water, r / 7));
  water.position.y = wl; water.receiveShadow = true; g.add(water);
  if (o.rinne) {
    const ri = new THREE.Mesh(new THREE.LatheGeometry([new V2(r - 1.3, wl - .5), new V2(r - 1.1, wl - .5), new V2(r - 1.1, wl + .1), new V2(r - 1.3, wl + .1), new V2(r - 1.3, wl - .5)], 80), M.concreteDark);
    g.add(ri);
  }
  if (o.tauch) { const t = new THREE.Mesh(new THREE.CylinderGeometry(r - (o.rinne ? 2.4 : 1.2), r - (o.rinne ? 2.4 : 1.2), 0.7, 80, 1, true), new THREE.MeshStandardMaterial({ color: 0x59626a, metalness: .4, roughness: .5, side: THREE.DoubleSide })); t.position.y = wl; g.add(t); }
  cyl(g, 1.4, 1.4, top + 1.6, M.concrete, 0, -1, 0);
  if (o.inlet) { const e = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 1.3, 40, 1, true), new THREE.MeshStandardMaterial({ color: 0x6d757c, metalness: .4, roughness: .5, side: THREE.DoubleSide })); e.position.y = wl - 0.2; g.add(e); }
  // Räumerbrücke
  const br = new THREE.Group(); g.add(br);
  const by = top + 0.75, x0 = o.full ? -r - 0.3 : 0, x1 = r + 0.3, L = x1 - x0;
  box(br, L, 0.5, 1.4, M.steel, (x0 + x1) / 2, by - 0.5, 0);
  box(br, L, 0.06, 1.3, M.grating, (x0 + x1) / 2, by, 0);
  for (const zs of [0.65, -0.65]) {
    box(br, L, 0.05, 0.05, M.galv, (x0 + x1) / 2, by + 1.1, zs, 0, false);
    box(br, L, 0.04, 0.04, M.galv, (x0 + x1) / 2, by + 0.55, zs, 0, false);
    for (let x = x0; x <= x1 + 0.01; x += L / Math.ceil(L / 2)) box(br, 0.05, 1.1, 0.05, M.galv, x, by, zs, 0, false);
  }
  box(br, 2.2, 1.1, 2.0, M.steelDark, 0, top + 0.4, 0); // Mittelantrieb / Drehlager
  if (!o.full) {
    box(br, 1.6, 1.3, 2.0, M.steelDark, r + 0.2, top, 0);           // Fahrwerk
    box(br, 0.8, 0.6, 0.6, M.green, r + 0.2, top + 1.3, 0.5);       // Fahrantrieb
    box(br, r - 3.5, 0.18, 0.08, M.steelDark, r / 2 + 1.2, wl + 0.02, 0.9, 0.04, false); // Schwimmschlammschild
    for (let x = 3; x < r - 1; x += 3) box(br, 0.12, by - wl - 0.4, 0.12, M.steelDark, x, wl - 0.1, -0.5, 0, false); // Räumschild-Gestänge
  } else {
    box(br, 1.2, 1.2, 1.2, M.green, 0, top + 1.5, 0);
    for (let a = 0; a < 4; a++) { const rod = box(br, 0.1, 1.2, 0.1, M.steelDark, Math.cos(a * Math.PI / 2) * 0.9, wl - 0.6, Math.sin(a * Math.PI / 2) * 0.9, 0, false); }
  }
  if (o.omega !== 0) anims.push({ type: 'rot', obj: br, omega: o.omega ?? 0.02 / r });
  return g;
}

// ------------------------------------------------------------------ Gelände, Bach
const creekX = z => 170 + 8 * Math.sin(z / 23) + 4 * Math.sin(z / 9 + 1);
const FENCE = { x0: -140, x1: 148, z0: -95, z1: 95 };
const CP = []; for (let z = -260; z <= 260; z += 2) CP.push([creekX(z), z]);
function creekDist(x, z) {
  if (Math.abs(x - 170) > 30) return 99;
  const i = Math.round((z + 260) / 2); let d = 99;
  for (let k = Math.max(0, i - 7); k <= Math.min(CP.length - 1, i + 7); k++) d = Math.min(d, Math.hypot(x - CP[k][0], z - CP[k][1]));
  return d;
}
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
{
  const W = 620, D = 520, g = new THREE.PlaneGeometry(W, D, 310, 260).rotateX(-Math.PI / 2);
  g.translate(10, 0, 0);
  const p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const out = Math.max(FENCE.x0 - x, x - FENCE.x1, FENCE.z0 - z, z - FENCE.z1, 0);
    let y = 0.5 * (Math.sin(x * 0.031) + Math.sin(z * 0.026 + 1.2)) * sstep(0, 40, out);
    const d = creekDist(x, z), s = sstep(1.5, 6.5, d);
    y = y * s + (-1.8) * (1 - s);
    p.setY(i, y);
    const n = 0.5 + 0.5 * Math.sin(x * 0.13 + Math.sin(z * 0.07) * 2) * Math.sin(z * 0.11);
    if (out === 0) c.setRGB(0.42 + n * 0.04, 0.58 + n * 0.04, 0.30);
    else if (x < -170 && Math.abs(z - 60) > 6) c.setHSL(((Math.floor((z + 300) / 45)) % 2) ? 0.17 : 0.24, 0.42, 0.40 + n * 0.06); // Feldflur
    else c.setRGB(0.36 + n * 0.05, 0.52 + n * 0.05, 0.27);
    if (d < 7) c.lerp(new THREE.Color(0.30, 0.42, 0.24), 1 - sstep(3, 7, d));
    if (d < 3.6) c.setRGB(0.32, 0.30, 0.24);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
  ground.receiveShadow = true; scene.add(ground);

  // Bach-Wasserband
  const pos = [], uv = [], idx = []; let s = 0;
  for (let i = 0; i < CP.length; i++) {
    const a = CP[Math.max(0, i - 1)], b = CP[Math.min(CP.length - 1, i + 1)];
    let tx = b[0] - a[0], tz = b[1] - a[1]; const l = Math.hypot(tx, tz); tx /= l; tz /= l;
    const nx = -tz, nz = tx, hw = 4.2; if (i) s += Math.hypot(CP[i][0] - CP[i - 1][0], CP[i][1] - CP[i - 1][1]);
    pos.push(CP[i][0] + nx * hw, -1.1, CP[i][1] + nz * hw, CP[i][0] - nx * hw, -1.1, CP[i][1] - nz * hw);
    uv.push(0, s / 9, 1, s / 9);
    if (i) { const k = i * 2; idx.push(k - 2, k - 1, k, k - 1, k + 1, k); }
  }

// ------------------------------------------------------------------ Bäume
{
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const T = [];
  const ok = (x, z) => {
    if (x > FENCE.x0 - 4 && x < FENCE.x1 + 4 && z > FENCE.z0 - 4 && z < FENCE.z1 + 4) return false;
    if (Math.abs(z - 60) < 7 && x < FENCE.x0) return false;
    return creekDist(x, z) > 7.5;
  };
  for (let n = 0; n < 2500 && T.length < 260; n++) {
    const x = -260 + rnd() * 560, z = -230 + rnd() * 460;
    const near = Math.min(Math.abs(x - FENCE.x0), Math.abs(x - FENCE.x1), Math.abs(z - FENCE.z0), Math.abs(z - FENCE.z1));
    if ((x < -170 && Math.abs(z - 60) > 6) && rnd() > 0.08) continue;      // Feldflur nur wenige Bäume
    if (near > 30 && rnd() > 0.35) continue;
    if (ok(x, z)) T.push([x, z]);
  }
  for (let z = -240; z < 240; z += 5) for (const side of [-1, 1]) if (rnd() > 0.25) { const x = creekX(z) + side * (8.5 + rnd() * 6); if (ok(x, z)) T.push([x, z + rnd() * 3]); }
  const crown = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ roughness: .9, flatShading: true }), T.length);
  const trunk = new THREE.InstancedMesh(cylGeo, M.trunk, T.length), o = new THREE.Object3D(), c = new THREE.Color();
  T.forEach(([x, z], i) => {
    const conifer = rnd() < 0.15, h = 3 + rnd() * 2.5, r = conifer ? 1.8 + rnd() : 2.3 + rnd() * 2;
    o.position.set(x, h / 2, z); o.scale.set(0.45, h, 0.45); o.rotation.set(0, 0, 0); o.updateMatrix(); trunk.setMatrixAt(i, o.matrix);
    o.position.set(x, h + r * (conifer ? 1.6 : 0.8), z); o.scale.set(r, r * (conifer ? 2.4 : 1.25), r); o.rotation.y = rnd() * 6; o.updateMatrix(); crown.setMatrixAt(i, o.matrix);
    crown.setColorAt(i, c.setHSL(conifer ? 0.36 : 0.22 + rnd() * 0.08, 0.45, 0.24 + rnd() * 0.1));
  });
  crown.castShadow = trunk.castShadow = true; scene.add(crown, trunk);
}

    const mat = new THREE.ShaderMaterial({
      uniforms: { uC: { value: new THREE.Color(f.c) }, uT: { value: 0 }, uL: { value: L } }, transparent: true,
      vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader: 'uniform vec3 uC; uniform float uT; uniform float uL; varying vec2 vUv; void main(){ float s=fract(vUv.x*uL/4.0-uT*0.5); float on=step(s,0.6); gl_FragColor=vec4(uC*(0.75+0.45*on),0.55+0.45*on);}'
    });
    flowMats.push(mat);

  }
}
const legend = document.getElementById('legend');
legend.innerHTML = Object.values(FLOW).map(f => `<div><i style="background:#${new THREE.Color(f.c).getHexString()}"></i>${f.n}</div>`).join('') + '<div style="color:#8395a7;margin-top:3px">schematisch, Leitungen liegen erdverlegt</div>';

// ------------------------------------------------------------------ UI: Labels, Auswahl, Rundgang
const TOUR = ['zpw', 'rechen', 'sandfang', 'vk', 'abschlag', 'bb', 'geblaese', 'fecl3', 'nk', 'rs', 'ablauf', 've', 'ft', 'gs', 'bhkw', 'fackel', 'sew', 'bg', 'bach'];
const SHORT = { zpw: 'Hebewerk', rechen: 'Rechen', sandfang: 'Sandfang', vk: 'VK1/VK2', abschlag: 'SV-201', bb: 'Belebung', geblaese: 'Gebläse', fecl3: 'FeCl₃', nk: 'NK1/NK2', rs: 'RS-PW', ablauf: 'Ablauf', ve: 'VE-1', ft: 'FT-1', gs: 'GS-1', bhkw: 'BHKW', fackel: 'F6.1', sew: 'Z6.1/SI6.1', bg: 'Betriebsgeb.', bach: 'Schwierbach' };

const marker = new THREE.Mesh(new THREE.RingGeometry(0.93, 1, 72).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffd54a, transparent: true, depthWrite: false }));

const info = document.getElementById('info'), infoBody = document.getElementById('infoBody'), tname = document.getElementById('tname');
let selected = null, tourIdx = -1, auto = null;
function select(id, fly) {
  selected = id; const c = comps[id];
  for (const k in comps) comps[k].el?.classList.toggle('sel', k === id);
  marker.visible = id !== 'bach'; marker.position.set(c.center.x, 0.12, c.center.z); marker.scale.setScalar(c.radius + 2.5);
  infoBody.innerHTML = `<h2>${c.name}</h2><div class="kks">${c.kks}</div><p>${c.text}</p><table>${c.rows.map(r => `<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>` +
    (c.note ? '<div class="note">* Abmessung für die 3D-Ansicht angenommen (in der PLS-Simulation nicht festgelegt).</div>' : '');
  info.style.display = 'block'; layout();
  tourIdx = TOUR.indexOf(id);
  tname.innerHTML = `${c.name} <small>${tourIdx + 1}/${TOUR.length}</small>`;
  if (fly) {
    const d = Math.min(160, Math.max(34, c.radius * 2.4 + 20));
    const dir = new THREE.Vector3(-0.35, 0.72, 0.9).normalize();
    const tgt = id === 'bach' ? new THREE.Vector3(creekX(-40), 0, -40) : c.center.clone(); tgt.z += d * 0.2;
    flyTo(tgt, tgt.clone().addScaledVector(dir, id === 'bach' ? 70 : d));
  }
}
function deselect() { selected = null; marker.visible = false; info.style.display = 'none'; for (const k in comps) comps[k].el.classList.remove('sel'); layout(); }
let fly = null;
function flyTo(target, pos, dur = 1.6) { fly = { t0: performance.now(), dur: dur * 1000, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos }; }
const homePos = () => innerWidth / innerHeight < 0.8 ? new THREE.Vector3(-345, 290, 105) : new THREE.Vector3(-150, 185, 235);
const homeTgt = () => innerWidth / innerHeight < 0.8 ? new THREE.Vector3(5, 0, 0) : new THREE.Vector3(0, 0, 0);
const HOME = () => flyTo(homeTgt(), homePos());

function stopAuto() { if (auto) { clearInterval(auto); auto = null; document.getElementById('bAuto').classList.remove('on'); document.getElementById('bAuto').textContent = '▶ Auto'; } }
document.getElementById('bNext').onclick = () => { stopAuto(); select(TOUR[(tourIdx + 1) % TOUR.length], true); };
document.getElementById('bPrev').onclick = () => { stopAuto(); select(TOUR[(tourIdx - 1 + TOUR.length) % TOUR.length], true); };
tname.onclick = () => { if (tourIdx < 0) select(TOUR[0], true); };
document.getElementById('bAuto').onclick = e => {

};

document.getElementById('bLbl').onclick = e => { showLbl = !showLbl; e.target.classList.toggle('on', showLbl); labelBox.style.display = showLbl ? '' : 'none'; };
document.getElementById('bFlow').onclick = e => { flowGroup.visible = !flowGroup.visible; e.target.classList.toggle('on', flowGroup.visible); legend.style.display = flowGroup.visible ? 'block' : 'none'; layout(); };
const SPEEDS = [1, 20, 100]; let speed = 100;
document.getElementById('bSpeed').onclick = e => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % 3]; e.target.textContent = speed === 1 ? 'Räumer Echtzeit' : `Räumer ×${speed}`; };
controls.addEventListener('start', () => { fly = null; stopAuto(); });

// Tippen/Klicken auf Bauwerke
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(pickables, false)[0];
  if (h) select(h.object.userData.comp, false); else deselect();
});

function layout() {
  const bh = document.getElementById('bottom').offsetHeight;

  legend.style.bottom = (bh + 8 + (info.style.display === 'block' ? info.offsetHeight + 8 : 0)) + 'px';
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); layout(); }
addEventListener('resize', resize); resize();
camera.position.copy(homePos()); controls.target.copy(homeTgt());

// ------------------------------------------------------------------ Animation
const clock = new THREE.Clock(), o3 = new THREE.Object3D(), pv = new THREE.Vector3();
let elapsed = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.1); elapsed += dt;
  for (const a of anims) {
    if (a.type === 'rot') a.obj.rotation.y -= a.omega * dt * speed;
    else { a.s = (a.s ?? 0) + a.v * dt * speed; const L = a.b - a.a, ph = a.s % (2 * L); a.obj.position.x = a.a + (ph < L ? ph : 2 * L - ph); }
  }
  bubbles.forEach((b, i) => {
    const s = 0.25 + 0.95 * Math.pow(Math.abs(Math.sin(elapsed * b[4] + b[3])), 3);
    o3.position.set(b[0], b[1], b[2]); o3.scale.set(s, 1, s); o3.updateMatrix(); bubbleMesh.setMatrixAt(i, o3.matrix);
  });
  bubbleMesh.instanceMatrix.needsUpdate = true;
  for (const w of waters) { w.tex.offset.x += w.flow[0] * dt; w.tex.offset.y += w.flow[1] * dt; }
  for (const m of flowMats) m.uniforms.uT.value = elapsed;
  if (marker.visible) marker.material.opacity = 0.55 + 0.45 * Math.sin(elapsed * 4);
  if (fly) {
    let t = Math.min(1, (performance.now() - fly.t0) / fly.dur); const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    controls.target.lerpVectors(fly.ft, fly.tt, e); camera.position.lerpVectors(fly.fp, fly.tp, e);
    if (t >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
  if (showLbl) for (const id of TOUR) {
    const c = comps[id]; pv.copy(c.anchor).project(camera);
    if (pv.z > 1 || Math.abs(pv.x) > 1.05 || Math.abs(pv.y) > 1.05) { c.el.style.display = 'none'; continue; }
    c.el.style.display = ''; c.el.style.transform = `translate(${(pv.x * .5 + .5) * innerWidth}px,${(-pv.y * .5 + .5) * innerHeight}px) translate(-50%,-100%)`;
  }
  requestAnimationFrame(tick);
}
window.__ka3d = { THREE, scene, renderer, camera, controls };
document.getElementById('load').remove();
